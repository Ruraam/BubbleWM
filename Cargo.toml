[package]
name = "bubblewm"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-or-later"
description = "A native, lightweight and customizable Wayland compositor for BubbleOS."
repository = "https://github.com/Ruraam/BubbleWM"
readme = "README.md"

[workspace]
members = ["bubble-ipc", "bubblepanel"]
resolver = "3"

[dependencies]
bubble-ipc = { path = "bubble-ipc" }
bubble-theme-engine = { path = "vendor/bubble-theme-engine" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
    "renderer_gl",
    "use_system_lib",
    "wayland_frontend",
    "desktop",
] }
smithay-drm-extras = { version = "0.1", default-features = false }
xcursor = "0.3"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fontdue = "0.9"
tiny-skia = "0.11"
zbus = { version = "4", features = ["blocking"] }

[dev-dependencies]
tempfile = "3"
