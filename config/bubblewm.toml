# BubbleWM configuration.
# Appearance and Bubble Color keys are persisted configuration foundations.
# They do not imply that wallpaper/font/icon rendering is already wired into the compositor.

schema_version = 1

[core]
backend = "winit"
layout = "floating"

[effects]
enabled = true
profile = "advanced"
blur = true
transparency = true
shadows = true
wobbly = true
workspace_cube = true

[theme]
source = "wallpaper"
automatic_contrast = true
smooth_transitions = true

[appearance]
# Set to an absolute image path to select a wallpaper.
# wallpaper = "/home/user/Pictures/wallpaper.jpg"
wallpaper_mode = "zoom"
icon_theme = "Bubble"
cursor_theme = "default"
cursor_size = 24
font_family = "Sans"
monospace_font_family = "Monospace"
font_size = 10
color_scheme = "dark"
accent_color = "#8B5CF6"

[bubble_color]
enabled = true
engine = "bubble-color"
palette_source = "wallpaper"
palette_variant = "vivid"
enforce_contrast = true

[decoration]
mode = "server"
titlebar = true
rounded_corners = true
